# Secret para el certificado TLS del API Gateway
# Crear con: kubectl create secret tls gateway-tls-secret \
#              --cert=nginx-gateway/ssl/tls.crt \
#              --key=nginx-gateway/ssl/tls.key \
#              -n default
# Este archivo es solo referencia; usar el comando kubectl arriba.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: <BASE64_DEL_tls.crt>    # cat tls.crt | base64 -w0
  tls.key: <BASE64_DEL_tls.key>    # cat tls.key | base64 -w0
