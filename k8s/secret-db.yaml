# Secret para credenciales de MySQL
# Generar los valores con: echo -n "valor" | base64
# IMPORTANTE: No subir este archivo con valores reales al repositorio
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
type: Opaque
data:
  DB_HOST: <BASE64_DE_LA_IP_MYSQL>       # echo -n "IP_PUBLICA" | base64
  DB_USER: <BASE64_DEL_USUARIO>           # echo -n "usuario" | base64
  DB_PASSWORD: <BASE64_DEL_PASSWORD>      # echo -n "password" | base64
