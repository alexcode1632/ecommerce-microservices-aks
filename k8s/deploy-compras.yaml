apiVersion: apps/v1
kind: Deployment
metadata:
  name: compras-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compras
  template:
    metadata:
      labels:
        app: compras
    spec:
      containers:
        - name: compras
          image: t92023630200acr.azurecr.io/compras:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: USUARIOS_URL
              value: "http://usuarios-svc:8080/Usuarios/rest/ws"
            - name: ARTICULOS_URL
              value: "http://articulos-svc:8080/Articulos/rest/ws"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
