# LoadBalancer — único servicio expuesto al exterior (RNF-12)
apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
