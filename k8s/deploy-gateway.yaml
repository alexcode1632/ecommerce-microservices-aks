apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: t92023630200acr.azurecr.io/gateway:latest
          ports:
            - containerPort: 80
            - containerPort: 443
          # Montar certificados TLS desde el Secret de K8s
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: tls-certs
          secret:
            secretName: gateway-tls-secret
