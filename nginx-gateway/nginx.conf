# ============================================================
# Nginx API Gateway — Tarea 9
# RNF-12: API Gateway con LoadBalancer
# RNF-14: Enruta cada petición al ClusterIP correspondiente
# RNF-15: Recibe HTTPS, envía HTTP a backends.
#         Certificado firmado por CA propia (no autofirmado).
# ============================================================

# Redirigir todo HTTP a HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # ── Certificado firmado por CA propia (RNF-15) ─────────────────────────────
    # El archivo tls.crt contiene: [cert del servidor] + [cert de la CA]
    ssl_certificate     /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Proxy headers comunes ─────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts para peticiones con payload grande (fotos en base64)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 20M;

    # ── RNF-14: Enrutamiento a microservicios (ClusterIP) ────────────────────
    # /usuarios/ → microservicio Gestión de usuarios
    location /usuarios/ {
        proxy_pass http://usuarios-svc:8080/Usuarios/;
    }

    # /articulos/ → microservicio Gestión de artículos
    location /articulos/ {
        proxy_pass http://articulos-svc:8080/Articulos/;
    }

    # /compras/ → microservicio Gestión de compras
    location /compras/ {
        proxy_pass http://compras-svc:8080/Compras/;
    }

    # / → Servidor web (frontend estático)
    location / {
        proxy_pass http://webserver-svc:80/;
    }
}
